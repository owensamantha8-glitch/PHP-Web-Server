name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'copilot/**'

jobs:
  php-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate PHP lint and path configuration
        run: scripts/validate-repo.sh
